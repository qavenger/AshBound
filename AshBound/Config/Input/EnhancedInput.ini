[Action]
Name=Jump
Type=Bool
Mappings=Key:Space;GamepadButton:A
Triggers=Pressed
Priority=0

[Action]
Name=Fire
Type=Bool
Mappings=MouseButton:Left;GamepadButton:RightTrigger
Triggers=Pressed
Priority=0

[Action]
Name=Move
Type=Axis2D
Mappings=KeyAxis2D:W,S,A,D;GamepadStick:Left
Modifiers=Deadzone(0.1)
Triggers=Always
Priority=0

[Action]
Name=Look
Type=Axis2D
Mappings=MouseDelta;GamepadStick:Right
Modifiers=Scale(0.02);InvertY
Triggers=Always
Priority=0

[Action]
Name=Quit
Type=Bool
Mappings=Key:Esc
Triggers=DoubleClick(0.2);Hold(0.5)
Priority=0

[Action]
Name=SwitchWorkingColorSpace
Type=Bool
Mappings=Key:1;Key:2;Key:3;Key:4;Key:5
Triggers=Pressed
Priority=0